name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and run unit regressions
        run: npm test -- --reporter spec

      - name: Build and verify packaged extension
        run: npm run test:package

      - name: Compile extension-host tests
        run: npx tsc -p tests/tsconfig.integration.json

      - name: Run minimum and current VS Code host tests (Linux)
        if: runner.os == 'Linux'
        env:
          GROUPCODE_PACKAGE_PATH: artifacts/package
        run: |
          xvfb-run -a node scripts/test-host.js
          VSCODE_VERSION=stable xvfb-run -a node scripts/test-host.js

      - name: Run VS Code host tests (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          GROUPCODE_PACKAGE_PATH: artifacts/package
        run: node scripts/test-host.js

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: |
            out/tests/
            artifacts/host-logs-*/
          retention-days: 7
